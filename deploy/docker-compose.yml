# Production stack on the web host (default: 192.168.1.206:/opt/hts-commercial-website).
# Public traffic: Cloudflare -> Caddy on 192.168.1.210 (TLS) -> this container on 192.168.1.206:HOST_PORT.
# IMAGE_TAG and HOST_PORT are written to .env by deploy.sh; do not edit them by hand.
name: hts-commercial-website

services:
  web:
    image: hts-commercial-website:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: hts-commercial-website
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5180}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Honour X-Forwarded-Proto/For from Caddy so HTTPS-only behaviour (secure cookies, HSTS) applies.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      AllowedHosts: "howto.software;www.howto.software;192.168.1.206;127.0.0.1;localhost"
    volumes:
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dataprotection-keys:
